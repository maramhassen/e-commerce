<h2>Connexion</h2>

<form (ngSubmit)="login()" #loginForm="ngForm">
  <div>
    <label for="email">Email</label>
    <input
      id="email"
      name="email"
      type="email"
      placeholder="Email"
      [(ngModel)]="email"
      required
    />
  </div>

  <div>
    <label for="motDePasse">Mot de passe</label>
    <input
      id="motDePasse"
      name="motDePasse"
      type="password"
      placeholder="Mot de passe"
      [(ngModel)]="motDePasse"
      required
    />
  </div>

  <button type="submit" [disabled]="!loginForm.form.valid">Se connecter</button>
</form>

<p *ngIf="errorMessage" style="color:red">
  {{ errorMessage }}
</p>

<p>
  Pas de compte ?
  <a routerLink="/register">S'inscrire</a>
</p>
