<div class="category-list-page">
  <div class="category-list-container">
    <div class="category-list-card">
      
      <!-- Header -->
      <div class="category-list-header text-center">
        <div class="icon-circle">
          <i class="fas fa-folder icon-main"></i>
        </div>
        <h2 class="category-list-title">Liste des catégories</h2>
        <p class="subtitle">Gérez les catégories de produits</p>
      </div>

      <!-- Bouton Ajouter -->
      <div class="add-section text-center mb-4">
        <button class="btn-add" (click)="goToAdd()">
          <i class="fas fa-plus-circle"></i>
          Ajouter une catégorie
        </button>
      </div>

      <!-- Message d'erreur -->
      <div *ngIf="errorMessage" class="alert alert-error">
        <div class="alert-content">
          <i class="fas fa-exclamation-circle"></i>
          <span>{{ errorMessage }}</span>
        </div>
      </div>

      <!-- Tableau des catégories -->
      <div *ngIf="categories.length > 0" class="table-wrapper">
        <table class="category-table">
          <thead>
            <tr>
              <th>Nom</th>
              <th>Description</th>
              <th class="text-center">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let c of categories">
              <td class="category-info-cell">
                <div class="category-icon">
                  <i class="fas fa-folder"></i>
                </div>
                <div class="category-details">
                  <span class="category-name">{{ c.nom }}</span>
                </div>
              </td>
              <td>
                <span class="category-description">{{ getDescription(c.description) }}</span>
              </td>
              <td class="text-center actions-cell">
                <button class="btn-edit" (click)="goToEdit(c.id)">
                  <i class="fas fa-pencil-alt"></i>
                  Modifier
                </button>
                <button class="btn-delete" (click)="deleteCategory(c.id)">
                  <i class="fas fa-trash-alt"></i>
                  Supprimer
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Message aucune catégorie -->
      <div *ngIf="categories.length === 0 && !errorMessage" class="empty-state">
        <div class="empty-icon">
          <i class="fas fa-folder-open"></i>
        </div>
        <h3>Aucune catégorie trouvée</h3>
        <p>Vous n'avez pas encore créé de catégorie.</p>
        <button class="btn-add-empty" (click)="goToAdd()">
          <i class="fas fa-plus-circle"></i>
          Ajouter une catégorie
        </button>
      </div>

      <!-- Bouton retour -->
      <div class="back-section text-center">
        <a class="back-link" routerLink="/">
          <i class="fas fa-arrow-left"></i>
          Retour à l'accueil
        </a>
      </div>

    </div>
  </div>
</div>
