<div class="cart-page">
  <div class="container" *ngIf="cart">
    <h2 class="mb-4">🛒 Mon Panier</h2>

    <table class="table table-bordered">
      <thead>
        <tr>
          <th>Produit</th>
          <th>Prix</th>
          <th>Quantité</th>
          <th>Total</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let item of cart.items">
          <td data-label="Produit">{{ item.product.nom }}</td>
          <td data-label="Prix">{{ item.prixUnitaire }} DT</td>

          <td data-label="Quantité" style="width:120px">
            <input
              type="number"
              class="form-control"
              min="1"
              [value]="item.quantite"
              (input)="updateQuantity(item, $any($event.target).value)"
            />
          </td>

          <td data-label="Total">{{ item.quantite * item.prixUnitaire }} DT</td>

          <td data-label="Action">
            <button class="btn btn-danger btn-sm" (click)="removeItem(item)">
              <i class="fas fa-trash-alt"></i> Supprimer
            </button>
          </td>
        </tr>
      </tbody>
    </table>

    <div class="text-end">
      <h4>Total : <span>{{ cart.total }} DT</span></h4>
    </div>
  </div>
</div>
