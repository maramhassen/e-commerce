<div class="container mt-4">
  <h2 class="mb-4">Liste des utilisateurs</h2>

  <!-- Chargement -->
  <div *ngIf="loading" class="alert alert-info">
    Chargement des utilisateurs...
  </div>

  <!-- Erreur -->
  <div *ngIf="!loading && errorMessage" class="alert alert-danger">
    {{ errorMessage }}
  </div>

  <!-- Cas : aucun utilisateur -->
  <div *ngIf="!loading && !errorMessage && users.length === 0" class="alert alert-info">
    Aucun utilisateur trouvé.
  </div>

  <!-- Tableau des utilisateurs -->
  <table *ngIf="!loading && !errorMessage && users.length > 0" class="table table-striped table-bordered">
    <thead class="table-dark">
      <tr>
        <th>Nom</th>
        <th>Prénom</th>
        <th>Email</th>
        <th>Rôle</th>
        <th>Actions</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let u of users">
        <td>{{ u.nom }}</td>
        <td>{{ u.prenom }}</td>
        <td>{{ u.email }}</td>
        <td>
          <span>{{ u.role }}</span>
        </td>
        <td>
          <button
            class="btn btn-danger btn-sm"
            (click)="deleteUser(u.id!)"
          >
            Supprimer
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
