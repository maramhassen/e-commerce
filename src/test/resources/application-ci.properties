# CONFIGURATION DE TEST POUR L'ENVIRONNEMENT CI


# === DOSSIER UPLOAD (Solution définitive) ===
file.upload-dir=${java.io.tmpdir}/ecommerce-uploads/images

# === BASE DE DONNÉES H2 EN MÉMOIRE ===
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# === JPA/HIBERNATE ===
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# === DÉSACTIVER LES COMPOSANTS NON NÉCESSAIRES ===
spring.mustache.enabled=false
spring.neo4j.autoconfigure.enabled=false
spring.data.neo4j.repositories.enabled=false

# === LOGGING ===
logging.level.root=WARN
logging.level.com.example.e_commerce=INFO