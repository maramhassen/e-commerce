spring.application.name=e-commerce

# File Upload
file.upload-dir=uploads/images
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2KB

# Static Resources
spring.web.resources.static-locations=classpath:/static/,classpath:/public/,file:uploads/

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/e-commerce?serverVersion=8.0.0
spring.datasource.username=root
spring.datasource.password=

# JPA Configuration
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Server
server.port=8080
# Monitoring - Actuator & Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=ecommerce