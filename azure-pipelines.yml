trigger:
  branches:
    include:
      - backend
      - front

variables:
  - group: PFE-secrets
  - name: BACKEND_IMAGE
    value: 'maramhassen/ecommerce-backend'
  - name: FRONTEND_IMAGE
    value: 'maramhassen/ecommerce-frontend'
  - name: IMAGE_TAG
    value: '$(Build.BuildId)'
  - name: K8S_NAMESPACE
    value: 'ecommerce'
  - name: NEXUS_REGISTRY
    value: '102.141.206.39:8082'

pool:
  name: 'Default'

stages:
# ══════════════════════════════════════════
# STAGE 0 : TEST ( pour debug)
# ══════════════════════════════════════════
- stage: Test
  displayName: '0 - Test Pipeline'
  jobs:
    - job: TestJob
      steps:
        - script: echo "Hello World - Pipeline fonctionne !"
          displayName: 'Test simple'

# ══════════════════════════════════════════
# STAGE 1 : BUILD BACKEND
# ══════════════════════════════════════════
- stage: BuildBackend
  displayName: '1 - Build Backend Spring Boot'
  jobs:
  - job: BackendBuild
    displayName: 'Maven build'
    steps:
    - checkout: none

    - script: |
        rm -rf backend-code
        git clone -b backend \
          https://$(GITHUB_TOKEN)@github.com/maramhassen/e-commerce.git \
          backend-code
        cd backend-code
        if [ ! -f "pom.xml" ]; then
          echo "❌ pom.xml non trouvé"
          exit 1
        fi
        mvn clean package -DskipTests
        echo "✅ Build backend réussi"
        ls -la target/
      displayName: 'Clone & Maven Build'

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: 'backend-code/target'
        ArtifactName: 'backend-jar'
      displayName: 'Publish backend artifacts'

# ══════════════════════════════════════════
# STAGE 2 : BUILD FRONTEND
# ══════════════════════════════════════════
- stage: BuildFrontend
  displayName: '2 - Build Frontend Angular'
  dependsOn: []
  jobs:
  - job: FrontendBuild
    displayName: 'npm & Angular build'
    steps:
    - checkout: none

    - task: UseNode@1
      inputs:
        version: '18.x'
      displayName: 'Install Node.js 18'

    - script: |
        rm -rf frontend-code
        git clone -b front \
          https://$(GITHUB_TOKEN)@github.com/maramhassen/e-commerce.git \
          frontend-code
        cd frontend-code
        if [ ! -f "package.json" ]; then
          echo "❌ package.json non trouvé"
          exit 1
        fi
        npm install
        npm run build -- --configuration production
        echo "✅ Build frontend réussi"
        ls -la dist/
      displayName: 'Clone & npm Build'

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: 'frontend-code/dist'
        ArtifactName: 'frontend-dist'
      displayName: 'Publish frontend artifacts'

# ══════════════════════════════════════════
# STAGE 3 : SONARQUBE ANALYSIS
# ══════════════════════════════════════════
- stage: CodeQuality
  displayName: '3 - SonarQube Analysis'
  dependsOn:
    - BuildBackend
    - BuildFrontend
  jobs:

  - job: SonarBackend
    displayName: 'SonarQube Backend'
    steps:
    - checkout: none

    - script: |
        rm -rf backend-code
        git clone -b backend \
          https://$(GITHUB_TOKEN)@github.com/maramhassen/e-commerce.git \
          backend-code
        cd backend-code
        mvn clean compile -DskipTests
        mvn sonar:sonar \
          -Dsonar.projectKey=ecommerce-backend \
          -Dsonar.projectName="E-commerce Backend" \
          -Dsonar.host.url=$(SONAR_HOST_URL) \
          -Dsonar.login=$(SONAR_TOKEN) \
          -Dsonar.java.binaries=target/classes \
          -Dsonar.sources=src/main/java
        echo "✅ SonarQube backend terminé"
      displayName: 'SonarQube Backend Analysis'

  - job: SonarFrontend
    displayName: 'SonarQube Frontend'
    steps:
    - checkout: none

    - script: |
        rm -rf frontend-code
        git clone -b front \
          https://$(GITHUB_TOKEN)@github.com/maramhassen/e-commerce.git \
          frontend-code
        cd frontend-code
        npm install
        cat > sonar-project.properties << EOF
        sonar.projectKey=ecommerce-frontend
        sonar.projectName=E-commerce Frontend
        sonar.sources=src
        sonar.exclusions=**/node_modules/**,**/*.spec.ts
        sonar.host.url=$(SONAR_HOST_URL)
        sonar.login=$(SONAR_TOKEN)
        EOF
        npx sonar-scanner
        echo "✅ SonarQube frontend terminé"
      displayName: 'SonarQube Frontend Analysis'

# ══════════════════════════════════════════
# STAGE 4 : BUILD DOCKER IMAGES
# ══════════════════════════════════════════
- stage: DockerBuild
  displayName: '4 - Build Docker Images'
  dependsOn: CodeQuality
  jobs:

  - job: DockerBackend
    displayName: 'Build Backend Docker Image'
    steps:
    - checkout: none

    - script: |
        rm -rf backend-code
        git clone -b backend \
          https://$(GITHUB_TOKEN)@github.com/maramhassen/e-commerce.git \
          backend-code
        cd backend-code
        if [ ! -f "Dockerfile" ]; then
          echo "❌ Dockerfile backend non trouvé"
          exit 1
        fi
        docker build \
          -t $(BACKEND_IMAGE):$(IMAGE_TAG) \
          -t $(BACKEND_IMAGE):latest .
        echo "✅ Image backend construite"
      displayName: 'Build Backend Image'

  - job: DockerFrontend
    displayName: 'Build Frontend Docker Image'
    steps:
    - checkout: none

    - script: |
        rm -rf frontend-code
        git clone -b front \
          https://$(GITHUB_TOKEN)@github.com/maramhassen/e-commerce.git \
          frontend-code
        cd frontend-code
        if [ ! -f "Dockerfile" ]; then
          echo "❌ Dockerfile frontend non trouvé"
          exit 1
        fi
        docker build \
          -t $(FRONTEND_IMAGE):$(IMAGE_TAG) \
          -t $(FRONTEND_IMAGE):latest .
        echo "✅ Image frontend construite"
      displayName: 'Build Frontend Image'

# ═══════════════════════════════════════════════════════════════════════
# STAGE 5 : SECURITY SCAN (TRIVY)
# ═══════════════════════════════════════════════════════════════════════
- stage: SecurityScan
  displayName: '5 - 🔒 Security Scan (Trivy)'
  dependsOn: DockerBuild
  jobs:
  - job: TrivyScan
    displayName: 'Trivy Vulnerability Scan'
    steps:
    - checkout: none

    # 1. Configuration de Docker pour autoriser Nexus (HTTP)
    - script: |
        echo "⚙️ Configuration de Docker pour autoriser Nexus (insecure-registries)..."
        sudo mkdir -p /etc/docker
        echo '{
          "insecure-registries": ["102.141.206.39:8082"]
        }' | sudo tee /etc/docker/daemon.json
        sudo systemctl restart docker
      displayName: 'Configure Docker for Nexus'

    # 2. Installation de Trivy
    - script: |
        echo "📦 Installation de Trivy..."
        if ! command -v trivy &> /dev/null; then
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
        fi
        echo "✅ Trivy version : $(trivy --version)"
      displayName: 'Install Trivy'

    # 3. Scan de l'image Backend
    - script: |
        echo "🔍 Scan de l'image BACKEND (maramhassen/ecommerce-backend:$(IMAGE_TAG))..."
        trivy image \
          --severity HIGH,CRITICAL \
          --format table \
          --exit-code 1 \
          maramhassen/ecommerce-backend:$(IMAGE_TAG) \
          || echo "❌ Des vulnérabilités CRITICAL ou HIGH ont été détectées dans le backend !"
        echo ""
      displayName: 'Trivy Scan (Backend)'

    # 4. Scan de l'image Frontend
    - script: |
        echo "🔍 Scan de l'image FRONTEND (maramhassen/ecommerce-frontend:$(IMAGE_TAG))..."
        trivy image \
          --severity HIGH,CRITICAL \
          --format table \
          --exit-code 1 \
          maramhassen/ecommerce-frontend:$(IMAGE_TAG) \
          || echo "❌ Des vulnérabilités CRITICAL ou HIGH ont été détectées dans le frontend !"
        echo "✅ Scan Trivy terminé."
      displayName: 'Trivy Scan (Frontend)'

# ══════════════════════════════════════════
# STAGE 6 : PUSH TO NEXUS
# ══════════════════════════════════════════
- stage: PushToNexus
  displayName: '6 - Push to Nexus Repository'
  dependsOn: SecurityScan
  jobs:
  - job: PushImages
    displayName: 'Push Validated Images to Nexus'
    steps:
    - script: |
        echo "=== LOGIN TO NEXUS ==="
        echo $(NEXUS_PASSWORD) | docker login \
          102.141.206.39:8082 \
          -u $(NEXUS_USERNAME) \
          --password-stdin

        echo "=== TAGGING IMAGES ==="
        docker tag $(BACKEND_IMAGE):$(IMAGE_TAG) \
          102.141.206.39:8082/ecommerce-backend:$(IMAGE_TAG)
        docker tag $(BACKEND_IMAGE):latest \
          102.141.206.39:8082/ecommerce-backend:latest

        docker tag $(FRONTEND_IMAGE):$(IMAGE_TAG) \
          102.141.206.39:8082/ecommerce-frontend:$(IMAGE_TAG)
        docker tag $(FRONTEND_IMAGE):latest \
          102.141.206.39:8082/ecommerce-frontend:latest

        echo "=== PUSHING BACKEND ==="
        docker push 102.141.206.39:8082/ecommerce-backend:$(IMAGE_TAG)
        docker push 102.141.206.39:8082/ecommerce-backend:latest

        echo "=== PUSHING FRONTEND ==="
        docker push 102.141.206.39:8082/ecommerce-frontend:$(IMAGE_TAG)
        docker push 102.141.206.39:8082/ecommerce-frontend:latest

        docker logout 102.141.206.39:8082
        echo "✅ Images poussées vers Nexus"
      displayName: 'Push to Nexus'

# ══════════════════════════════════════════
# STAGE 7 : DEPLOY TO KUBERNETES
# ══════════════════════════════════════════
- stage: Deploy
  displayName: '7 - Deploy to AKS Engine'
  dependsOn: PushToNexus
  jobs:
  - deployment: K8sDeploy
    displayName: 'Deploy to Azure Stack Hub Kubernetes'
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: none

          - task: DownloadSecureFile@1
            name: kubeconfig
            inputs:
              secureFile: 'kubeconfig.dc2.json'
            displayName: 'Download kubeconfig'

          - script: |
              export KUBECONFIG=$(kubeconfig.secureFilePath)

              echo "=== MISE À JOUR DES IMAGES ==="
              kubectl set image deployment/backend \
                backend=$(NEXUS_REGISTRY)/ecommerce-backend:$(IMAGE_TAG) \
                -n $(K8S_NAMESPACE)

              kubectl set image deployment/frontend \
                frontend=$(NEXUS_REGISTRY)/ecommerce-frontend:$(IMAGE_TAG) \
                -n $(K8S_NAMESPACE)

              echo "=== ATTENTE DU DÉPLOIEMENT ==="
              kubectl rollout status deployment/backend \
                -n $(K8S_NAMESPACE) --timeout=5m

              kubectl rollout status deployment/frontend \
                -n $(K8S_NAMESPACE) --timeout=5m

              echo "=== VÉRIFICATION FINALE ==="
              kubectl get pods -n $(K8S_NAMESPACE)
              kubectl get svc -n $(K8S_NAMESPACE)

              echo "✅ Déploiement réussi !"
              echo "🌐 Application: http://102.141.206.178"
            displayName: 'kubectl Deploy'